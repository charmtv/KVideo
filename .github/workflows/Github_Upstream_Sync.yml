name: Upstream Sync

permissions:
  contents: write

env:
  TARGET_BRANCH: main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/Github_Upstream_Sync.yml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync_latest_from_upstream:
    name: 同步上游最新提交
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: 使用 GitHub 同步接口更新分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! output=$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f "branch=${TARGET_BRANCH}" 2>&1); then
            output=${output//$'\n'/' '}
            echo "::error title=上游同步失败::${output}"
            exit 1
          fi
          printf '%s\n' "${output}"
